services:
  # PostgreSQL Database with pg_cron for scheduled jobs
  db:
    build:
      context: .
      dockerfile: .docker/postgres/Dockerfile
    container_name: footballhome_db
    restart: always
    environment:
      POSTGRES_DB: footballhome
      POSTGRES_USER: footballhome_user
      POSTGRES_PASSWORD: footballhome_pass
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      ENVIRONMENT: ${ENVIRONMENT:-dev}  # dev or production
    ports:
      - "5432:5432"
    volumes:
      # Mount data folder to neutral location to prevent auto-loading
      - ./database/data:/app/data:ro,Z
      # Persistent data storage
      - db_data:/var/lib/postgresql/data
    networks:
      - footballhome_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footballhome_user -d footballhome"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s
    # Required for pg_cron with reasonable logging (DDL only)
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=footballhome
      -c log_statement=ddl
      -c log_duration=off
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p] %u@%d '
      -c client_min_messages=notice

  # C++ Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footballhome_backend
    restart: always
    env_file: ./env
    environment:
      POSTGRES_PASSWORD: footballhome_pass
      INSTAGRAM_USER_ID: ${INSTAGRAM_USER_ID:-26233831926285183}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_ADS_TOKEN: ${META_ADS_TOKEN:-}
      # Shared literal with the leagueapps-sync sidecar below — lets
      # LeadsController::isLeadsSyncBearer() authenticate that sidecar's
      # GET /api/leads + POST /:id/mark-converted calls without a signed
      # admin JWT (it has no human user). Compose-internal only.
      LEADS_SYNC_BEARER: ${LEADS_SYNC_BEARER:-leagueapps-sync}
      # Slice 13 sub-slice 8: sim debug endpoints (/api/sim/debug/*).
      # Admin-only + rate-limited; still gated behind this flag so a
      # future prod deploy can turn it off without a rebuild.
      FH_ENABLE_SIM_DEBUG: ${FH_ENABLE_SIM_DEBUG:-0}
      # Cross-container replay RPC (sub-slice 8.1). Backend POSTs to
      # this URL. FH_SIM_ADMIN_TOKEN is deliberately NOT listed here;
      # it flows in from `env_file: ./env` above so we don't override
      # it to empty when the shell environment doesn't export it.
      FH_SIM_ADMIN_URL: ${FH_SIM_ADMIN_URL:-http://footballhome_sim:9101}
      # Slice 14.1 — SimOrchestrator.
      #
      # FH_SIM_ORCHESTRATOR_ENABLED is deliberately NOT declared here
      # (unlike other flags above) — it flows in via `env_file: ./env`.
      # If we set `${FH_SIM_ORCHESTRATOR_ENABLED:-0}` here, podman-compose
      # would substitute the SHELL env at compose time (usually unset →
      # "0") and then pass `-e FH_SIM_ORCHESTRATOR_ENABLED=0` to the
      # container, which stomps the env-file value. Leaving it off the
      # `environment:` block means env_file wins. Set it to 1 in
      # ./env for dev deployments that want the boot probe.
      #
      # SIM_PODMAN_SOCKET is the path *inside this container* — must
      # match the target of the bind mount below.
      #
      # WARNING: mounting the host's rootful podman socket into this
      # container grants root-equivalent access to the host podman
      # daemon. Only leave the volume mount in place on hosts where
      # the backend is trusted with that authority.
      SIM_PODMAN_SOCKET: /run/podman/podman.sock
    ports:
      - "3001:3001"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount database/data for writing ##u/##p files
      - ./database/data:/app/database/data
      # Shared image storage (backend writes, frontend serves via nginx)
      - ./frontend/images/posts:/app/images/posts
      - ./frontend/images/exercises:/app/images/exercises
      # Lock-up gate photos (#security, mig 424) — served by nginx at /images/security/
      - ./frontend/images/security:/app/images/security
      # Club crests (#logos, mig 428) — backend writes the cached copy of each
      # club_logos row here; nginx serves it at /images/clubs/.  The read-only
      # site mount is for the one-time import of the hand-placed crests.
      - ./frontend/images/clubs:/app/images/clubs
      - ./frontend/images/league-logos:/app/images/league-logos
      - ./frontend/images:/app/images/site:ro
      # LeagueApps API private key for JWT-bearer OAuth (RS256).  Used by
      # LeagueAppsService when fetching program registrations during team
      # reconciliation.  Read-only — same key file the Python sync scripts
      # used to share with the (now-removed) meta-leads-webhook container.
      - ./config:/app/config:ro
      # Slice 14.1 — rootful podman REST API socket. Mounted read-write
      # so SimOrchestrator can create/start/stop per-match sim daemons
      # (slices 14.3 / 14.5). Disabled by default at the code level via
      # FH_SIM_ORCHESTRATOR_ENABLED=0 — the mount is harmless when the
      # env flag is off. See sim/DESIGN.md §16.7 / draft ADR §22.19.
      - /run/podman/podman.sock:/run/podman/podman.sock:rw
    networks:
      - footballhome_network
    depends_on:
      db:
        condition: service_healthy

  # Frontend (Vanilla JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: footballhome_frontend
    restart: always
    ports:
      - "3000:80"
    volumes:
      # Serve all frontend files directly from host — no rebuild needed on changes
      - ./frontend:/usr/share/nginx/html
      - ./frontend/images/posts:/usr/share/nginx/html/images/posts
      - ./frontend/images/exercises:/usr/share/nginx/html/images/exercises
    networks:
      - footballhome_network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LeagueApps → leads.converted_at auto-match sidecar.
  #
  # Hourly poll of every configured LeagueApps program ID (boys / girls /
  # mens / membership) — for each active SPOT_RESERVED registrant whose
  # email also lives in our `leads` table as an open lead, we POST
  # `/api/leads/:id/mark-converted` with source='leagueapps'.  Manual
  # signed-up flags always win (the script skips any lead whose
  # converted_at is already non-NULL).
  #
  # The sidecar speaks only to the backend HTTP API — no direct DB
  # access — so it stays cleanly isolated.  LEADS_SYNC_BEARER is an
  # opaque literal shared with the `backend` service above (see
  # LeadsController::isLeadsSyncBearer, 2026-08-08) — it's checked as
  # an alternative to a signed admin JWT on exactly the two routes this
  # sidecar calls.  Keep it identical in both services' `environment:`
  # blocks; overridable via the host env so we can tighten it later
  # without a code change here.
  # Archive drop — token-gated upload receiver for research captures
  # (e.g. the Newspapers.com full-page recapture for Brian in the Papers,
  # 2026-10-14).  Browser-side JS fetches a page image inside the user's
  # own logged-in session and POSTs the bytes here via the frontend
  # nginx route /archive-drop/.  DROP_TOKEN lives in ./env (never in git).
  # Files land in ./archive/ on the host — outside frontend/, so nothing
  # here is publicly served.
  archive-drop:
    image: python:3.11-slim
    container_name: footballhome_archive_drop
    restart: unless-stopped
    env_file: ./env
    volumes:
      - ./scripts/archive-drop.py:/app/recv.py:ro
      - ./archive/newspapers-fullres:/files
    command: python3 /app/recv.py
    networks:
      - footballhome_network

  leagueapps-sync:
    image: python:3.11-slim
    container_name: footballhome_leagueapps_sync
    restart: unless-stopped
    env_file: ./env
    environment:
      BACKEND_URL: http://backend:3001
      LEADS_SYNC_BEARER: leagueapps-sync
      # Re-run every hour.  Registration export is cheap (one HTTPS call
      # per program) and pause-friendly — bumping this to 5min during
      # a registration push is safe.
      SYNC_INTERVAL_SECONDS: "3600"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./config:/app/config:ro
    working_dir: /app
    command: >
      sh -c "
        pip install --quiet --no-cache-dir requests pyjwt cryptography &&
        echo 'leagueapps-sync ready — interval='$$SYNC_INTERVAL_SECONDS's' &&
        while true; do
          python3 scripts/sync-leagueapps-conversions.py 2>&1 || echo 'sync failed (will retry next cycle)';
          sleep $$SYNC_INTERVAL_SECONDS;
        done
      "
    networks:
      - footballhome_network
    depends_on:
      backend:
        condition: service_started


  # fh-game match daemon (game/DESIGN.md). One container == one match in
  # G0 (match_id 1); per-match orchestration arrives G3+. Internal network
  # only — nginx proxies /game → footballhome_game:9200 (TLS terminated at
  # the frontend). JWT_SECRET flows in from env_file.
  footballhome_game:
    build:
      context: ./game
      dockerfile: Dockerfile
    container_name: footballhome_game
    restart: always
    env_file: ./env
    environment:
      GAME_BIND_ADDRESS: 0.0.0.0
      GAME_PORT: "9200"
      GAME_MATCH_ID: "1"
      GAME_SLOT_COUNT: "22"
      GAME_SPEED: "1"
      GAME_HALF_MINUTES: "45"   # real football: 2 x 45 min at real time
      # Formation codes resolved against the club's `formations` table at
      # boot (G4.2). POSTGRES_PASSWORD flows in via env_file.
      GAME_FORMATION_HOME: "4-4-2"
      GAME_FORMATION_AWAY: "4-3-3"
      # Mig 636 (G4.30): real teams; each plays its own formation
      # (game_demo_teams.formation_code) over the two lines above.
      GAME_TEAM_HOME: "Lighthouse APSL"
      GAME_TEAM_AWAY: "Ukrainian Nationals"
      # Skill bands (G4.3): u10|u14|amateur|semipro|pro|world|perfect.
      GAME_LEVEL_HOME: "semipro"
      GAME_LEVEL_AWAY: "semipro"
      GAME_MATCH_SEED: "42"
      POSTGRES_HOST: footballhome_db
      POSTGRES_DB: footballhome
      POSTGRES_USER: footballhome_user
      # Explicit (not via env_file) to match the db/backend services —
      # the env file's POSTGRES_PASSWORD differs from the container DB's.
      POSTGRES_PASSWORD: footballhome_pass
    networks:
      - footballhome_network
    healthcheck:
      test: ["CMD-SHELL", "ss -Hln --tcp sport = :9200 | grep -q LISTEN"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s

# Named volumes for persistent data
volumes:
  db_data:
    driver: local

# Custom network for service communication
networks:
  footballhome_network:
    driver: bridge
