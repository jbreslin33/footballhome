# Forward proxy inside the scraper+VPN container (started by entrypoint.sh
# once WireGuard is up).  The backend container reaches it on the
# footballhome network as http://footballhome_scraper:3128 and everything
# it relays leaves through the tunnel.
User tinyproxy
Group tinyproxy
Port 3128
Timeout 120
MaxClients 20
LogLevel Connect

# Containers on the podman bridges only; the port is never published.
Allow 10.0.0.0/8
Allow 127.0.0.1

# HTTPS to the hosts in tinyproxy.filter and nothing else.
ConnectPort 443
Filter "/etc/tinyproxy/tinyproxy.filter"
FilterExtended On
FilterDefaultDeny Yes
