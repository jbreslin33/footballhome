server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Archive drop — research-capture upload receiver (see docker-compose.yml).
    location /archive-drop/ {
        proxy_pass http://archive-drop:8977/;
        client_max_body_size 100M;
        proxy_read_timeout 180s;
    }

    # Default: no caching on everything
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    etag off;
    if_modified_since off;

    # Meta lead gen webhook — now served by the C++ backend
    # (LeadsWebhookController, Phase 14).  Rides the /api/-style catch-all
    # below but needs its own block because it doesn't live under /api/.
    location /webhook/meta-leads {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Youth roster (Phase 7) is C++ as of YouthRosterController —
    # rides the /api/ catch-all to the backend below.  No carve-out needed.

    # Mens roster (Phase 8) is C++ as of MensRosterController — covers
    # GET /api/mens-roster, POST /api/mens-roster/assign, and
    # POST /api/mens-roster/roster-status.  Rides the /api/ catch-all.

    # NOTE: GET /api/teams/:teamId/reconciliation is C++ as of Phase 3b
    # (HttpClient + JwtRS256 + LeagueAppsService +
    # PersonLinker + TeamReconciliation).  It rides the /api/ catch-all
    # to the backend below — no carve-out needed.

    # LA Players Pool (Phase 6) is C++ as of ClubLaPoolController — rides
    # the /api/ catch-all to the backend below.  No carve-out needed.

    # Persons API — fully served by C++ backend as of Phase 2b of the
    # (now-completed) Node → C++ migration.  Rides the /api/ catch-all
    # below; the explicit block exists only to document the boundary.
    location /api/persons {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Raised from 10m (2026-08-28) so a coach can attach a real phone
        # clip to a post. The payload is a base64 data URL inside a JSON
        # body, which inflates the file by 4/3, so this ceiling is really
        # about a 48MB file — matching SocialPostCard.MAX_MEDIA_BYTES,
        # which rejects anything larger up front with a plain message
        # instead of letting it upload into a 413. The backend's own cap
        # is 200MB (main.cpp), so this is the binding constraint.
        client_max_body_size 64m;
        proxy_read_timeout 300s;
    }

    # /game — WebSocket endpoint for the fh-game match daemon (G0.6,
    # game/PROTOCOL.md §1). JWT rides inside Sec-WebSocket-Protocol
    # (`fh-game.v1.bearer.<JWT>`); nginx forwards it verbatim and is not
    # aware of auth.
    #
    # Variable upstream + resolver = request-time DNS [v1 pattern]: nginx
    # starts fine even when the game container is down (a literal host
    # here would crash-loop nginx at startup — the exact footgun the old
    # /sim block had). 10.89.0.1 is podman's aardvark-dns on this host.
    # Per-match routing (/game/<key>) arrives with orchestration, G3+.
    resolver 10.89.0.1 valid=5s ipv6=off;
    location = /game {
        set $game_upstream footballhome_game;
        proxy_pass http://$game_upstream:9200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;

        # Long-lived binary stream: 30 Hz snapshots, no buffering.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
        proxy_buffering off;
    }

    # Instagram post images
    location ^~ /images/posts/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # Game-model exercise photos — filenames are unique per upload
    # (timestamp-suffixed), so unlike /images/posts/ they're safe to
    # cache long-term.
    location ^~ /images/exercises/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # PWA manifest — force correct MIME type + no-cache like everything else.
    location = /manifest.json {
        default_type application/manifest+json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # PWA service worker — must be served from the site root with
    # no-cache so updates roll out immediately.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    # /pickup — public guest funnel (standalone landing, NOT the SPA).
    # Meta ad CTAs point here so unauthenticated ad traffic lands on a
    # dedicated form that POSTs to /api/leads/guest-signup.  Both /pickup
    # and /pickup.html serve the same static file so we don't care which
    # variant the copy uses.
    location = /pickup {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /pickup.html =404;
    }
    location = /pickup/ {
        return 301 /pickup;
    }

    # /invoice?k=<slug> — the public invoice sheet (mig 480), standalone
    # like /pickup.  The slug is a UUID; the page fetches
    # /api/invoices/public/<slug>, which needs no sign-in.
    location = /invoice {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /invoice.html =404;
    }

    # /cup-roster?k=<slug> — the public USASA player pool sheet (mig 556),
    # same shape as /invoice: the page fetches /api/cup-rosters/public/<slug>.
    location = /cup-roster {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /cup-roster.html =404;
    }

    # /reset-password — public password-reset landing (standalone, NOT
    # the SPA).  Emailed reset links point here with a ?token=... query
    # string; the page POSTs the raw token + new password to
    # /api/auth/reset-password.
    location = /reset-password {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /reset-password.html =404;
    }
    location = /reset-password/ {
        return 301 /reset-password;
    }

    # /privacy and /terms — public legal pages (standalone, NOT the SPA).
    # The Twilio A2P 10DLC campaign registration links to both; the
    # wording is message_templates rows (migration 420) rendered by
    # legal.html, which picks the row from the path.
    location = /privacy {
        default_type text/html;
        try_files /legal.html =404;
    }
    location = /terms {
        default_type text/html;
        try_files /legal.html =404;
    }
    # Text-alert sign-up (consent form) — the Twilio A2P campaign's call to
    # action.  Copy = message_templates kind legal_sms (mig 482).
    # /rc/<slug> — the live RSVP roll call card (mig 544), standalone like
    # /sms: no SPA, no sign-in to view; the page fetches
    # /api/public/roll-call?k=<slug> and, when signed in, answers through
    # /api/calendar/rsvp.  Never cached — it is live.
    location ^~ /rc/ {
        default_type text/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /rollcall.html =404;
    }

    location = /sms {
        default_type text/html;
        try_files /sms.html =404;
    }

    # Client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}