<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Club updates — Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">

  <!--
    Public club sign-up: nginx serves this file at /sms (standalone, NOT the
    SPA — no auth, no service worker).  This is the call to action the
    Twilio A2P 10DLC campaign points at, so a carrier reviewer can open it:
    what is sent, how often, rates, STOP/HELP, privacy + terms, and an
    un-ticked text-message box that is OPTIONAL — the form sends with the
    box left empty (name + email, club updates only), and texts go only to
    someone who ticked it (mig 512; Twilio error 30923 while the box was
    required).  No wording lives here: every string is a message_templates
    row (kind legal_sms, migration 482 / 512) served by
    GET /api/public/program-copy.  The form posts to
    POST /api/public/sms-opt-in, which keeps a ticked consent as proof.
  -->
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f4f6fa; color: #16213e; font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: #0b1c3d; color: #f6f8fc; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    header img { width: 40px; height: 40px; }
    header strong { font-size: 18px; }
    header span { display: block; font-size: 13px; color: #b8c4dc; }
    main { max-width: 720px; margin: 0 auto; padding: 8px 16px 48px; }
    h3 { margin: 28px 0 8px; color: #0b1c3d; font-size: 20px; }
    h3:first-child { margin-top: 20px; }
    p { margin: 0 0 12px; }
    ul { margin: 0 0 12px; padding-left: 22px; }
    li { margin: 4px 0; }
    a { color: #0b4fd6; }
    form { background: #fff; border: 1px solid #d5dbe7; border-radius: 12px; padding: 16px; margin-top: 24px; }
    form h3 { margin-top: 0; }
    label.f { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
    input[type=text], input[type=email], input[type=tel] { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #b9c2d3; border-radius: 8px; }
    label.c { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; font-size: 14px; line-height: 1.45; }
    label.c input { margin-top: 3px; width: 18px; height: 18px; flex: none; }
    button { font: inherit; font-weight: 600; background: #0b4fd6; color: #fff; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { margin-top: 12px; font-size: 15px; }
    .msg.bad { color: #b3261e; }
    .msg.ok { color: #0f6d2f; font-weight: 600; }
    footer { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; font-size: 13px; color: #556; }
    footer a { margin-right: 14px; }
  </style>
</head>
<body>
  <header>
    <img src="/images/lighthouse-1893-crest.png" alt="">
    <div><strong>Football Home</strong><span>Lighthouse 1893 Soccer Club</span></div>
  </header>
  <main>
    <div id="body"><p>Loading…</p></div>
    <form id="f" hidden>
      <h3 id="t-title"></h3>
      <label class="f" for="name" id="t-name"></label>
      <input type="text" id="name" name="name" autocomplete="name" maxlength="200" required>
      <label class="f" for="email" id="t-email"></label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
      <label class="f" for="phone" id="t-phone"></label>
      <input type="tel" id="phone" name="phone" autocomplete="tel" inputmode="tel" maxlength="40" placeholder="(215) 555-0100">
      <label class="c"><input type="checkbox" id="consent" name="consent"><span id="t-consent"></span></label>
      <button type="submit" id="go"></button>
      <div class="msg" id="msg"></div>
    </form>
  </main>
  <footer><a href="/privacy">Privacy policy</a><a href="/terms">Terms and conditions</a><a href="/">footballhome.org</a></footer>

  <script src="/js/lib/program-info.js?v=20260924a"></script>
  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const copy = new Map();
      const c = (tier) => copy.get(tier) || '';
      const fill = (t, tok) => Object.keys(tok).reduce((s, k) => s.split(`{${k}}`).join(tok[k]), t);

      fetch('/api/public/program-copy').then(r => r.json()).then(j => {
        for (const row of (j.data && j.data.templates) || []) if (row.kind === 'legal_sms') copy.set(row.tier, row.body || '');
        return window.LighthouseProgramInfo.buildPublicPage('legal_sms');
      }).then(({ html }) => {
        $('body').innerHTML = html || '<p>Not available.</p>';
        $('t-title').textContent = c('form_title');
        $('t-name').textContent = c('name_label');
        $('t-email').textContent = c('email_label');
        $('t-phone').textContent = c('phone_label');
        // The consent line links its own "Privacy policy" / "Terms and conditions" words.
        const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
        $('t-consent').innerHTML = esc(c('consent'))
          .replace('Privacy policy', '<a href="/privacy" target="_blank" rel="noopener">Privacy policy</a>')
          .replace('Terms and conditions', '<a href="/terms" target="_blank" rel="noopener">Terms and conditions</a>');
        $('go').textContent = c('button');
        $('f').hidden = false;
      }).catch(() => { $('body').innerHTML = '<p>Not available right now.</p>'; });

      $('f').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = $('msg');
        const name = $('name').value.trim(), email = $('email').value.trim(), phone = $('phone').value.trim();
        const digits = phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
        // The text-message box is optional: un-ticked, the form still sends
        // and no texts follow.  Ticked, it needs a mobile number.
        const texts = $('consent').checked;
        msg.className = 'msg bad';
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { msg.textContent = c('need_email'); return; }
        if (texts && digits.length !== 10) { msg.textContent = c('need_phone'); return; }
        $('go').disabled = true; msg.textContent = '';
        try {
          const r = await fetch('/api/public/sms-opt-in', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, email, phone, consent: texts, consent_text: texts ? c('consent') : '' }),
          });
          const j = await r.json().catch(() => ({}));
          if (!r.ok || !j.success) throw new Error(j.message || r.statusText);
          msg.className = 'msg ok';
          msg.textContent = fill(c(texts ? 'thanks' : 'thanks_email'),
            { name, email, phone: `(${digits.slice(0, 3)}) ${digits.slice(3, 6)}-${digits.slice(6)}` });
          $('f').reset();
        } catch (err) {
          msg.textContent = c('error') || err.message;
        } finally { $('go').disabled = false; }
      });
    })();
  </script>
</body>
</html>
