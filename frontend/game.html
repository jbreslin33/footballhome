<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Zero-cache mandate, matching the rest of the app. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Game — Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1c3d;
                 font-family: -apple-system, system-ui, sans-serif; }
    #game-canvas { display: block; width: 100vw; height: 100vh;
                   touch-action: none; }
    #status { position: fixed; top: env(safe-area-inset-top, 8px); left: 50%;
              transform: translateX(-50%); max-width: 70vw; text-align: center;
              color: #f4f6fb; font-size: 13px; padding: 6px 14px; margin-top: 4px;
              pointer-events: none; background: rgba(11,28,61,.72);
              border-radius: 16px; }
    #scoreboard { background: rgba(11,28,61,.85); padding: 6px 12px;
                  border-radius: 8px; border: 1px solid rgba(255,204,0,.35); }
    #back { position: fixed; top: env(safe-area-inset-top, 8px); left: 8px;
            color: #ffcc00; text-decoration: none; font-size: 14px;
            padding: 10px; }
    /* Virtual joystick (input.js shows/positions it on touch). */
    #joystick { display: none; position: fixed; width: 120px; height: 120px;
                border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
                background: rgba(255,255,255,.08); pointer-events: none; }
    #joystick-knob { position: absolute; left: 35px; top: 35px; width: 50px;
                     height: 50px; border-radius: 50%;
                     background: rgba(255,204,0,.75); }
    /* Kick buttons — thumb-reachable, lower right. */
    .kick-btn { position: fixed; right: 16px; width: 74px; height: 74px;
                border-radius: 50%; border: 2px solid rgba(255,255,255,.4);
                background: rgba(255,255,255,.12); color: #f4f6fb;
                font-weight: 700; font-size: 13px; letter-spacing: 1px;
                touch-action: none; user-select: none; -webkit-user-select: none; }
    #btn-pass { bottom: calc(env(safe-area-inset-bottom, 12px) + 104px); }
    #btn-loft { bottom: calc(env(safe-area-inset-bottom, 12px) + 16px); }
    /* Modes over the one Lighthouse model (James 10/22): GAME shows the
       match controls; DESIGN (the pitch planner) hides them. */
    body.mode-design .game-only, body.mode-other .game-only { display: none !important; }
    /* DESIGN's layer pills switch leaves/contours (pitch-planner.js). */
    body.mode-design #btn-leaves, body.mode-design #btn-contours { display: none !important; }
    #mode-note { display: none; position: fixed; left: 50%; transform: translateX(-50%); top: 8px; z-index: 20;
      max-width: min(520px, calc(100vw - 16px)); box-sizing: border-box; padding: 8px 12px; border-radius: 10px;
      background: rgba(10,14,20,.86); color: #f4f6fb; font: 12px system-ui, sans-serif; }
    body.mode-other #mode-note { display: block; }
    #mode-bar { position: fixed; left: 8px; top: 84px; z-index: 12; display: flex; flex-wrap: wrap; gap: 0;
      max-width: calc(100vw - 120px);
      border: 2px solid #ffd24d; border-radius: 14px; overflow: hidden; background: rgba(10,14,20,.72); }
    #mode-bar button { min-width: 0; min-height: 0; padding: 4px 12px; border: 0; background: transparent;
      color: #f4f6fb; font: 600 11px system-ui, sans-serif; cursor: pointer; }
    #mode-bar button.on { background: #ffd24d; color: #10141a; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <a id="back" href="/">‹ Home</a>
  <div id="scoreboard" class="game-only" style="position: fixed; top: env(safe-area-inset-top, 8px);
       right: 12px; color: #ffcc00; font-weight: 700; font-size: 14px;
       letter-spacing: 1px; pointer-events: none;
       text-shadow: 0 1px 3px rgba(0,0,0,.6);"></div>
  <div id="status" class="game-only">loading…</div>
  <button id="btn-auto" class="kick-btn game-only" style="right: auto; left: 16px;
       bottom: calc(env(safe-area-inset-bottom, 12px) + 16px); width: 60px;
       height: 60px; font-size: 11px;">AUTO</button>
  <!-- Admin-only (shown when HELLO grants the admin capability): tap to
       cycle each team's skill band live. -->
  <button id="btn-level-home" class="kick-btn game-only" style="display: none;
       right: auto; left: 12px; top: 44px; bottom: auto; width: 92px;
       height: 34px; border-radius: 17px; font-size: 11px;">H: —</button>
  <button id="btn-level-away" class="kick-btn game-only" style="display: none;
       right: auto; left: 112px; top: 44px; bottom: auto; width: 92px;
       height: 34px; border-radius: 17px; font-size: 11px;">A: —</button>
  <button id="btn-edit" class="kick-btn game-only" style="display: none; right: auto;
       left: 212px; top: 44px; bottom: auto; width: 64px; height: 34px;
       border-radius: 17px; font-size: 11px;">EDIT</button>
  <!-- Admin edit mode: paint a team identity in one tap (mig 630 presets). -->
  <div id="preset-bar" class="game-only" style="display: none; position: fixed; top: 86px;
       left: 12px; align-items: center; gap: 6px; z-index: 10;">
    <select id="preset-select" style="height: 30px; max-width: 150px;
         background: rgba(11,28,61,.95); color: #f4f6fb; font-size: 12px;
         border: 1px solid rgba(255,255,255,.25); border-radius: 15px;
         padding: 0 8px;"></select>
    <button id="preset-home" class="kick-btn" style="position: static;
         min-width: 0; min-height: 0; width: 48px; height: 30px;
         border-radius: 15px; font-size: 11px;">→ H</button>
    <button id="preset-away" class="kick-btn" style="position: static;
         min-width: 0; min-height: 0; width: 48px; height: 30px;
         border-radius: 15px; font-size: 11px;">→ A</button>
  </div>
  <div id="edit-panel" class="game-only" style="display: none; position: fixed; top: 126px;
       left: 12px; width: 280px; background: rgba(11,28,61,.95);
       border: 1px solid rgba(255,255,255,.25); border-radius: 10px;
       padding: 12px; color: #f4f6fb; font-size: 13px; z-index: 10;"></div>
  <button id="btn-cam" class="kick-btn" style="right: 12px; top: 44px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">CAM TV</button>
  <button id="btn-zoom-in" class="kick-btn" style="right: 60px; top: 84px;
       bottom: auto; width: 40px; height: 34px; border-radius: 17px;
       font-size: 18px; padding: 0;">+</button>
  <button id="btn-zoom-out" class="kick-btn" style="right: 12px; top: 84px;
       bottom: auto; width: 40px; height: 34px; border-radius: 17px;
       font-size: 18px; padding: 0;">−</button>
  <button id="btn-leaves" class="kick-btn" style="right: 12px; top: 124px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">LEAVES OFF</button>
  <button id="btn-contours" class="kick-btn" style="right: 12px; top: 164px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">LIDAR 10CM</button>
  <button id="btn-follow" class="kick-btn" style="right: 12px; top: 244px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">FOLLOW ON</button>
  <div id="mode-bar"><button data-mode="game">🎮 GAME</button><button data-mode="design">📐 DESIGN</button><button data-mode="practice">🦺 PRACTICE</button><button data-mode="barn">🎪 BARN NIGHT</button><button data-mode="rodeo">🐂 RODEO</button></div>
  <div id="mode-note"></div>
  <div id="joystick" class="game-only"><div id="joystick-knob"></div></div>
  <button id="btn-pass" class="kick-btn game-only">PASS</button>
  <button id="btn-loft" class="kick-btn game-only">LOFT</button>
  <button id="btn-tackle" class="kick-btn game-only" style="bottom: calc(env(safe-area-inset-bottom, 12px) + 192px);">TKL</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
  <script src="js/game/wire.js?v=20261023d"></script>
  <script src="js/game/net.js?v=20261023b"></script>
  <script src="js/game/players.js?v=20261022j"></script>
  <script src="js/game/lighthouse-site.js?v=20261022s"></script>
  <script src="js/game/lighthouse-trees.js?v=20261022zi"></script>
  <script src="js/game/lighthouse-contours.js?v=20261022zs"></script>
  <script src="js/game/lighthouse-drainage.js?v=20261022zzd"></script>
  <script src="js/game/lighthouse-layout.js?v=20261024c"></script>
  <script src="js/game/field.js?v=20261024d"></script>
  <script src="js/game/camera.js?v=20261022p"></script>
  <script src="js/game/renderer.js?v=20261023a"></script>
  <script src="js/game/input.js?v=20261022e"></script>
  <script src="js/game/lighthouse-planner-data.js?v=20261022d"></script>
  <script src="js/game/pitch-planner.js?v=20261024k"></script>
  <script src="js/game/client.js?v=20261024a"></script>
</body>
</html>
