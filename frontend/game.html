<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- Zero-cache mandate, matching the rest of the app. -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Game — Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1c3d;
                 font-family: -apple-system, system-ui, sans-serif; }
    #game-canvas { display: block; width: 100vw; height: 100vh;
                   touch-action: none; }
    #status { position: fixed; top: env(safe-area-inset-top, 8px); left: 50%;
              transform: translateX(-50%); max-width: 70vw; text-align: center;
              color: #f4f6fb; font-size: 13px; padding: 6px 14px; margin-top: 4px;
              pointer-events: none; background: rgba(11,28,61,.72);
              border-radius: 16px; }
    #scoreboard { background: rgba(11,28,61,.85); padding: 6px 12px;
                  border-radius: 8px; border: 1px solid rgba(255,204,0,.35); }
    #back { position: fixed; top: env(safe-area-inset-top, 8px); left: 8px;
            color: #ffcc00; text-decoration: none; font-size: 14px;
            padding: 10px; }
    /* The page's pill buttons (camera, view, layers). */
    .kick-btn { position: fixed; right: 16px; border: 2px solid rgba(255,255,255,.4);
                background: rgba(255,255,255,.12); color: #f4f6fb;
                font-weight: 700; font-size: 13px; letter-spacing: 1px;
                touch-action: none; user-select: none; -webkit-user-select: none; }
    /* Until view-menu.js has applied this device's choices, the page shows no floating controls. */
    body.mode-game:not(.hud-ready) [data-hud] { display: none !important; }
    body.view-2d { background: #2f6b2a; }
  </style>
</head>
<body class="mode-game"><!-- view-menu.js hides the HUD until the ☰ Menu choices load -->
  <canvas id="game-canvas"></canvas>
  <a id="back" href="/">‹ Home</a>
  <div id="scoreboard" class="game-only" style="position: fixed; top: env(safe-area-inset-top, 8px);
       right: 12px; color: #ffcc00; font-weight: 700; font-size: 14px;
       letter-spacing: 1px; pointer-events: none;
       text-shadow: 0 1px 3px rgba(0,0,0,.6);"></div>
  <div id="status" class="game-only" data-hud="status">loading…</div>
  <button id="btn-cam" data-hud="camera" class="kick-btn" style="right: 12px; top: 44px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">CAM TV</button>
  <button id="btn-view" class="kick-btn" style="right: 12px; top: 204px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">3D VIEW</button>
  <button id="btn-zoom-in" data-hud="camera" class="kick-btn" style="right: 60px; top: 84px;
       bottom: auto; width: 40px; height: 34px; border-radius: 17px;
       font-size: 18px; padding: 0;">+</button>
  <button id="btn-zoom-out" data-hud="camera" class="kick-btn" style="right: 12px; top: 84px;
       bottom: auto; width: 40px; height: 34px; border-radius: 17px;
       font-size: 18px; padding: 0;">−</button>
  <button id="btn-follow" data-hud="camera" class="kick-btn" style="right: 12px; top: 244px;
       bottom: auto; width: 92px; height: 34px; border-radius: 17px;
       font-size: 11px;">FOLLOW ON</button>

  <!-- three.js 0.160 as an ES module; boot.js exposes THREE and loads the game scripts in order
       (their versions live in boot.js). Graphics tier 2 step 1, 11/11. -->
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
  <script type="module" src="js/game/boot.js?v=20261124pure"></script>
</body>
</html>
