<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">
  <!-- The teaching room (docs/teaching-room.md): a club tactic plan played by the game
       engine in a private room. Its own page — game.html is the pure Premier League sim
       and knows nothing of this. Every word comes from message_templates kind 'teach'. -->
  <style>
    :root { color-scheme: dark; --bg: #0b1c3d; --panel: #10264f; --line: rgba(255,255,255,.16);
            --ink: #f4f6fb; --dim: #a9b6d3; --gold: #ffcc00; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
                 font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
    #app { display: grid; height: 100dvh; grid-template-rows: auto auto minmax(0, 1fr); }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px;
             padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px 6px; }
    header a { color: var(--gold); text-decoration: none; font-weight: 700; }
    header h1 { margin: 0; font-size: 16px; }
    #matchup { color: var(--dim); font-size: 13px; }
    #bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 12px 8px; }
    button { font: 700 13px system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.12);
             border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px; cursor: pointer; }
    button:disabled { opacity: .4; cursor: default; }
    button.primary { background: var(--gold); color: #0b1c3d; border-color: var(--gold); }
    button.on { background: var(--ink); color: #0b1c3d; }
    #speeds { display: inline-flex; gap: 4px; align-items: center; color: var(--dim); font-size: 12px; }
    #speeds button { padding: 6px 10px; }
    #status { flex-basis: 100%; font-weight: 700; color: var(--gold); min-height: 1.4em; }
    main { display: grid; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #pitch-box { position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #side { padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); max-height: 34dvh; overflow: auto;
            border-top: 1px solid var(--line); background: var(--panel); }
    #side h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    #jobs { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px 14px;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    #jobs li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
    #jobs .n { flex: none; width: 26px; height: 22px; border-radius: 11px; text-align: center; font-weight: 800;
               font-variant-numeric: tabular-nums; background: var(--us, #4169e1); color: var(--us-ink, #fff); }
    #jobs .j { font-weight: 700; }
    #jobs .t { color: var(--dim); }
    #jobs li.changed .j { color: var(--gold); }
    #jobs li a { color: var(--ink); font-weight: 700; text-decoration: none; padding: 6px 0; display: block; }
    #jobs li a:hover { color: var(--gold); }
    a.pill { color: var(--gold); font-weight: 700; font-size: 13px; text-decoration: none; padding: 8px 6px; }
    /* Picking a plan: no room yet, so no pitch and no room controls — the list is the page. */
    body.picking #pitch-box, body.picking #bar button, body.picking #speeds, body.picking a.pill { display: none; }
    body.picking main { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
    body.picking #side { max-height: none; border: 0; }
    body.picking #jobs { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    #kinds { display: inline-flex; gap: 4px; align-items: center; color: var(--dim); font-size: 12px; }
    #kinds button { padding: 6px 10px; }
    /* One player's mind (teach.js paintMind). */
    body.focused #jobs { grid-template-columns: 1fr; gap: 2px; }
    #jobs li.mind-h { margin-top: 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); display: block; }
    #jobs li.mind-row { display: grid; grid-template-columns: 62px 1fr; gap: 8px; align-items: baseline; }
    #jobs li.mind-row .k { color: var(--dim); font-size: 12px; }
    #jobs li.mind-row .v { font-weight: 700; }
    #jobs li.mind-row.now .v { color: var(--gold); }
    #jobs li small { display: block; font-weight: 400; color: var(--dim); font-size: 11.5px; line-height: 1.35; }
    #jobs li.mind-fact { display: block; font-size: 13px; }
    #jobs li.mind-fact.stale { color: #ff8fa3; font-weight: 700; }
    #jobs li.mind-note { display: block; color: var(--dim); font-size: 12px; margin-top: 8px; }
    #jobs li.mind-opt { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; align-items: baseline; }
    #jobs li.mind-opt .s { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
    #jobs li.mind-opt small { grid-column: 2; }
    #jobs li.mind-opt.win .v { color: var(--gold); font-weight: 800; }
    #jobs li.mind-opt.wants .v { color: #7fd7ff; font-weight: 700; }
    #jobs li.mind-opt.false { opacity: .5; }
    #note { margin: 8px 0 0; color: var(--dim); font-size: 12px; max-width: 70ch; }
    @media (min-width: 900px) {
      main { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); }
      #side { max-height: none; border-top: 0; border-left: 1px solid var(--line); }
      #jobs { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <a id="back" href="/"></a>
      <h1 id="title"></h1>
      <span id="matchup"></span>
    </header>
    <div id="bar">
      <button id="btn-step" class="primary" disabled></button>
      <button id="btn-play" disabled></button>
      <button id="btn-restart"></button>
      <span id="speeds"><span id="speed-label"></span></span>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <main>
      <div id="pitch-box"><canvas id="pitch"></canvas></div>
      <aside id="side">
        <h2 id="jobs-title"></h2>
        <ul id="jobs"></ul>
        <p id="note"></p>
      </aside>
    </main>
  </div>
  <!-- The wire codec is the game protocol's own (one decoder for every client). -->
  <script src="js/game/wire.js?v=20261124mind"></script>
  <script src="js/teach/teach.js?v=20261124mind2"></script>
</body>
</html>
