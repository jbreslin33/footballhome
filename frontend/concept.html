<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">
  <!-- The concept viewer (js/teach/concept.js): the live match, whole pitch, every player with his
       states written small beside him; a scrub bar to go back and forward, a speed slider. Opened
       from 🧬 Taxonomy's 🎮. Every word is message_templates kind 'taxonomy', or the concept's own
       catalogue row. Owner 11/25: "all controls on pitch and transpearnet. the iptch should be whole
       screen. exit is transparent on pitch". -->
  <style>
    :root { color-scheme: dark; --bg: #0b1c3d; --panel: #10264f; --line: rgba(255,255,255,.16); --ink: #f4f6fb; --dim: #a9b6d3; --gold: #ffcc00; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
    #app { position: fixed; left: 0; top: 0; width: 100vw; height: 100dvh; }
    /* The pitch runs side to side, as a pitch is shaped. A phone held upright gets it turned, to be
       tilted ("orient field side to side. even on phone as they would tilt phone"). */
    @media (orientation: portrait) {
      #app { width: 100dvh; height: 100vw; transform-origin: top left; transform: rotate(90deg) translateY(-100%); }
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    /* every control sits ON the pitch, see-through */
    .glass { background: rgba(6,10,18,.32); border: 1px solid rgba(255,255,255,.22); border-radius: 14px; color: var(--ink);
             text-shadow: 0 0 3px #000, 0 1px 2px #000; backdrop-filter: none; }
    button.glass { font: 800 13px system-ui, sans-serif; padding: 6px 12px; cursor: pointer; }
    button.glass:hover { background: rgba(6,10,18,.5); }
    #ctitle { position: absolute; left: 10px; top: calc(env(safe-area-inset-top, 0px) + 8px); font-size: 15px; color: var(--gold); }
    #ctitle::after { content: ' ⓘ'; font-weight: 400; font-size: 12px; opacity: .75; }
    #exit { position: absolute; right: 10px; top: calc(env(safe-area-inset-top, 0px) + 8px); }
    #hint { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translateX(-50%); font-size: 12px; color: var(--dim);
            text-shadow: 0 0 3px #000, 0 1px 2px #000; pointer-events: none; white-space: nowrap; }

    #controls { position: absolute; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
                display: flex; align-items: center; gap: 10px; padding: 6px 10px; }
    #playbtn { flex: 0 0 auto; width: 38px; padding: 6px 0; font-size: 15px; }
    #clock { flex: 0 0 auto; font: 700 12px system-ui, sans-serif; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
    #live { flex: 0 0 auto; font-size: 11px; padding: 4px 9px; }
    #live.on { color: #ff5c5c; border-color: rgba(255,92,92,.6); }
    #speedbox { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; font: 700 12px system-ui, sans-serif; }
    #speedval { min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
    input[type=range] { -webkit-appearance: none; appearance: none; background: transparent; margin: 0; height: 26px; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
    input[type=range]::-moz-range-track { height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -5.5px; border-radius: 50%; background: var(--gold); border: 0; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--gold); border: 0; }
    #scrubwrap { flex: 1 1 auto; min-width: 80px; position: relative; display: flex; align-items: center; }
    #scrubwrap #scrub { flex: 1 1 auto; width: 100%; }
    #strip { position: absolute; left: 0; right: 0; top: -12px; height: 8px; pointer-events: none; }
    #strip .lane { position: absolute; left: 0; right: 0; height: 7px; border-radius: 3px; background: rgba(255,255,255,.12); }
    #strip .lane.main { box-shadow: 0 0 0 1px rgba(255,204,0,.6); }
    #strip .spell { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
    #spellnav { flex: 0 0 auto; display: flex; gap: 4px; }
    #spellnav button { font: 700 12px system-ui, sans-serif; padding: 4px 8px; }
    #onlybtn.on { background: rgba(255,204,0,.85); color: #0b1c3d; }
    #focus { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 34px); transform: translateX(-50%); max-width: min(720px, calc(100% - 24px));
             padding: 8px 16px; border-radius: 12px; text-align: center; pointer-events: none; z-index: 5; }
    #focus .f1 { font: 800 18px system-ui, sans-serif; }
    #focus .f2 { font: 600 12px system-ui, sans-serif; color: var(--dim); margin-top: 3px; }
    #focus.in { border: 2px solid #2ecc71; } #focus.in .f1 { color: #2ecc71; }
    #focus.out { border: 2px solid #ff4d4d; } #focus.out .f1 { color: #ff4d4d; }
    #clipbar { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); transform: translateX(-50%); max-width: min(820px, calc(100% - 24px));
               display: flex; align-items: center; gap: 8px; padding: 6px 8px; font: 600 13px system-ui, sans-serif; }
    #clipbar .kind { font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    #clipbar .kind.good { background: #1f7a45; color: #eafff1; } #clipbar .kind.bad { background: #9b2333; color: #ffecef; }
    #clipbar button { font: 800 14px system-ui, sans-serif; padding: 3px 10px; }
    #focus.off { border: 2px solid rgba(255,255,255,.25); } #focus.off .f1 { color: var(--dim); font-size: 15px; }
    #scrub::-webkit-slider-runnable-track { background: linear-gradient(to right, rgba(255,204,0,.8) var(--p, 0%), rgba(255,255,255,.3) var(--p, 0%)); }
    #speed { width: 110px; }

    #loader { position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); width: min(420px, calc(100% - 40px)); padding: 12px 16px; }
    #loader[hidden] { display: none; }
    #load-title { font-weight: 800; margin-bottom: 8px; }
    #load-track { height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; }
    #load-bar { height: 100%; width: 0; background: var(--gold); transition: width .25s linear; }
    #load-pct { text-align: right; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; margin-top: 2px; }

    /* one popup for every meaning: the concept, a player's states */
    /* HIS states, docked beside the pitch (owner 11/25 "we need the states on the side" · "1 line each"):
       one line per thing; each machine a block — its name, then its state, his man, the numbers. */
    /* Boxes down the left: formation, style, then actions at the bottom (owner 11/25). */
    #tag { position: absolute; left: 8px; top: 50px; z-index: 3; display: flex; flex-direction: column; gap: 8px; overflow: auto;
           font-size: 13px; line-height: 1.4; text-shadow: 0 0 3px #000, 0 0 3px #000, 0 1px 2px #000; }
    #tag .who { font-weight: 800; color: var(--gold); padding: 0 4px; }
    #tag .box { background: rgba(6,10,18,.32); border: 1px solid rgba(255,255,255,.22); border-radius: 10px; padding: 5px 8px 6px; }
    #tag .box-actions { margin-top: auto; border-color: rgba(124,252,138,.45); }
    #tag .box-style { border-color: rgba(255,204,0,.45); }
    #tag .box-formation { border-color: rgba(159,195,255,.5); }
    #tag .box-possession { border-color: rgba(255,255,255,.45); }
    #tag .box-concepts { border-color: rgba(255,150,90,.5); }
    #tag tr.on td.val { color: #7cfc8a; }
    #tag tr.off td.val { color: #ff6b6b; }
    #tag .bt { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
    #tag tr.none td { color: var(--dim); }
    #tag:empty { display: none; }
    /* the state table: one row per state — Machine | State | Man | Detail */
    #tag table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
    #tag th { text-align: left; font-size: 9.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim);
              padding: 2px 6px 3px 2px; border-bottom: 1px solid rgba(255,255,255,.25); }
    #tag td { padding: 3px 6px 3px 2px; vertical-align: top; border-bottom: 1px solid rgba(255,255,255,.1); }
    #tag tr.row { cursor: pointer; }
    #tag tr.row:hover td { background: rgba(255,255,255,.1); }
    #tag td.lab { font-weight: 800; color: var(--dim); font-size: 11px; }
    #tag tr.m td.lab { color: #7cfc8a; }
    #tag tr.c td.lab, #tag tr.c td.val { color: var(--gold); }
    #tag td.val { font-weight: 700; }
    #tag td.man { font-weight: 800; color: #ff9fb2; white-space: nowrap; }
    #tag td.det { color: var(--dim); font-size: 11.5px; }
    #tag tr.sub td { padding-left: 16px; }
    #tag tr.c td.val { color: var(--gold); }
    #tag td.val::after { content: ' ⓘ'; opacity: .45; font-weight: 400; font-size: 10.5px; }
    #popup { position: absolute; inset: 0; background: rgba(0,0,0,.5); display: grid; place-items: center; z-index: 20; }
    #popup[hidden] { display: none; }
    #popup .box { position: relative; max-width: min(640px, calc(100% - 32px)); max-height: 86%; overflow: auto; background: var(--panel);
                  border: 1px solid var(--gold); border-radius: 14px; padding: 14px 16px; font-size: 14px; line-height: 1.5; }
    #popup p { margin: 0 0 6px; }
    #popup .key { color: var(--dim); font-size: 12.5px; margin: 0 0 2px; }
    #popup h3 { margin: 0 34px 8px 0; color: var(--gold); font-size: 16px; }
    #popup-x { position: absolute; top: 8px; right: 10px; font: 700 18px system-ui; line-height: 1; padding: 3px 9px; color: var(--ink);
               background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    #popup table { border-collapse: collapse; font-size: 13.5px; }
    #popup th { text-align: left; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); padding: 1px 10px 3px 2px; }
    #popup td { padding: 3px 10px 3px 2px; vertical-align: baseline; }
    #popup tr.row { cursor: pointer; }
    #popup tr.row:hover td { background: rgba(255,255,255,.07); }
    #popup td.lab { font-weight: 800; color: var(--gold); font-size: 12.5px; }
    #popup tr.m td.lab { color: #7cfc8a; }
    #popup td.val { font-weight: 700; }
    #popup td.val::after { content: ' ⓘ'; opacity: .5; font-weight: 400; font-size: 11px; }
    #popup td.man { font-weight: 800; color: #ff9fb2; }
    #popup td.det { color: var(--dim); font-size: 12.5px; }
    #popup tr.def td { color: var(--dim); font-size: 12.5px; padding: 0 4px 6px 12px; white-space: normal; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="pitch"></canvas>
    <button id="ctitle" class="glass" type="button"></button>
    <div id="hint"></div>
    <div id="focus" class="glass" hidden></div>
    <div id="tag"></div>
    <div id="clipbar" class="glass" hidden><button id="clipprev" class="glass" type="button">◀</button><span id="clipkind" class="kind"></span><span id="cliptxt"></span><button id="clipnext" class="glass" type="button">▶</button></div>
    <button id="exit" class="glass" type="button"></button>
    <div id="controls" class="glass">
      <button id="playbtn" class="glass" type="button">⏸</button>
      <span id="scrubwrap"><span id="strip" hidden></span><input id="scrub" type="range" min="0" max="1" step="1" value="0"></span>
      <span id="clock"></span>
      <button id="live" class="glass" type="button"></button>
      <span id="spellnav" hidden><button id="prevspell" class="glass" type="button">⏮</button><button id="onlybtn" class="glass" type="button"></button><button id="nextspell" class="glass" type="button">⏭</button><button id="stripmode" class="glass" type="button"></button></span>
      <span id="speedbox"><input id="speed" type="range" min="0" max="100" step="1" value="50"><span id="speedval"></span></span>
    </div>
    <div id="loader" class="glass"><div id="load-title"></div><div id="load-track"><div id="load-bar"></div></div><div id="load-pct"></div></div>
    <div id="popup" hidden><div class="box"><button id="popup-x" type="button">×</button><h3 id="popup-t"></h3><div id="popup-b"></div></div></div>
  </div>
  <script src="js/game/wire.js?v=20261125possread"></script>
  <script src="js/teach/concept.js?v=20261125clips2"></script>
</body>
</html>
