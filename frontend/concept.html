<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Football Home</title>
  <link rel="icon" href="/images/lighthouse-1893-crest.png" type="image/png">
  <!-- The concept clip viewer (js/teach/concept.js): examples of ONE concept cut from the live
       match and shown so it cannot be missed. Opened from 🧬 Taxonomy's 🎮. Every word is
       message_templates kind 'taxonomy' (clip_*), or the concept's own catalogue row. -->
  <style>
    :root { color-scheme: dark; --bg: #0b1c3d; --panel: #10264f; --line: rgba(255,255,255,.16); --ink: #f4f6fb; --dim: #a9b6d3; --gold: #ffcc00; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
    #app { display: grid; height: 100dvh; grid-template-rows: auto auto minmax(0, 1fr) auto; }
    header { padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 4px; }
    header h1 { margin: 0; font-size: 20px; }
    #cue { color: var(--ink); font-size: 14px; max-width: 90ch; margin-top: 2px; }
    #does { color: var(--dim); font-size: 12.5px; max-width: 110ch; margin-top: 2px; }
    #bar { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 8px 14px; }
    #which { font-weight: 800; color: var(--gold); font-size: 15px; }
    #dots { display: inline-flex; gap: 5px; }
    .dot { width: 14px; height: 14px; padding: 0; border-radius: 50%; border: 2px solid var(--dim); background: transparent; cursor: pointer; }
    .dot.on { background: var(--gold); border-color: var(--gold); }
    button { font: 700 13px system-ui, sans-serif; color: var(--ink); background: rgba(255,255,255,.12); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px; cursor: pointer; }
    button:disabled { opacity: .35; cursor: default; }
    button.on { background: var(--ink); color: #0b1c3d; }
    #replay { background: var(--gold); color: #0b1c3d; border-color: var(--gold); }
    #replay.pulse { box-shadow: 0 0 0 4px rgba(255,204,0,.35); }
    #rates { display: inline-flex; gap: 4px; align-items: center; }
    #rates button { padding: 6px 10px; }
    #speed { color: var(--dim); font-size: 12px; }
    main { display: grid; min-height: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    #stage { position: relative; min-height: 0; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #phases { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
    #phases span { padding: 5px 14px; border-radius: 14px; font-weight: 800; font-size: 13px; letter-spacing: .06em; background: rgba(8,12,18,.7); color: var(--dim); }
    #phases span.on { background: var(--gold); color: #0b1c3d; font-size: 16px; }
    #time { position: absolute; left: 14px; right: 14px; bottom: 12px; height: 10px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; }
    #time::before { content: ''; position: absolute; top: 0; bottom: 0; left: var(--from, 0%); width: calc(var(--to, 0%) - var(--from, 0%)); background: rgba(255,204,0,.75); }
    #time::after { content: ''; position: absolute; top: -3px; bottom: -3px; left: var(--now, 0%); width: 3px; background: #fff; }
    #side { padding: 10px 14px; max-height: 36dvh; overflow: auto; border-top: 1px solid var(--line); background: var(--panel); }
    #side h2 { margin: 0 0 4px; font-size: 14px; }
    #side h3 { margin: 12px 0 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--gold); }
    #side ul { list-style: none; margin: 0; padding: 0; }
    #side li { padding: 3px 8px; border-radius: 8px; font-size: 13px; color: var(--dim); }
    #side li.on { background: var(--gold); color: #0b1c3d; font-weight: 800; }
    #side li.done { color: var(--ink); }
    #side li small { display: block; font-weight: 400; font-size: 11.5px; opacity: .85; }
    #side .now { font-weight: 800; font-size: 15px; }
    #side .note { color: var(--dim); font-size: 11.5px; margin-top: 12px; }
    footer { padding: 6px 14px calc(env(safe-area-inset-bottom, 0px) + 8px); color: var(--dim); font-size: 12px; }
    @media (min-width: 900px) {
      main { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: minmax(0, 1fr); }
      #side { max-height: none; border-top: 0; border-left: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1 id="title"></h1>
      <div id="cue"></div>
      <div id="does"></div>
    </header>
    <div id="bar">
      <span id="which"></span>
      <span id="dots"></span>
      <button id="prev" type="button"></button>
      <button id="replay" type="button"></button>
      <button id="next" type="button"></button>
      <button id="pause" type="button"></button>
      <span id="rates"><span id="speed"></span></span>
    </div>
    <main>
      <div id="stage">
        <canvas id="pitch"></canvas>
        <div id="phases"><span id="ph-before"></span><span id="ph-doing"></span><span id="ph-after"></span></div>
        <div id="time"></div>
      </div>
      <aside id="side"></aside>
    </main>
    <footer id="legend"></footer>
  </div>
  <script src="js/game/wire.js?v=20261124mind"></script>
  <script src="js/teach/concept.js?v=20261124b"></script>
</body>
</html>
